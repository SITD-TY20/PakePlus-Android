<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魏玛记账 · Papiermark Ledger</title>
<style>
:root {
  --bg: #0b0d12;
  --surface: #141821;
  --surface-2: #1b202b;
  --border: #262d3a;
  --text: #e6eaf2;
  --muted: #8a94a8;
  --accent: #d4a24c;
  --accent-glow: rgba(212, 162, 76, .12);
  --green: #4caf7a;
  --red: #e0556a;
  --radius: 14px;
  --shadow: 0 12px 36px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans JP", "Noto Sans", sans-serif;
  background: radial-gradient(1100px 500px at 50% -8%, #1b2233 0%, var(--bg) 60%);
  color: var(--text);
  min-height: 100vh;
  padding: 20px 14px 80px;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 860px; margin: 0 auto; }

header {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 20px;
}
header h1 { font-size: 20px; font-weight: 700; letter-spacing: .02em; }
header h1 span { color: var(--accent); }
.header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lang-select {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  padding: 8px 12px; border-radius: 10px; font-size: 13px; outline: none; cursor: pointer;
}
.lang-select:focus { border-color: var(--accent); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: .18s; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); background: var(--surface-2); }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: 700; }
.btn-primary:hover { background: #e0b05a; }
.btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
.btn-danger { color: var(--red); border-color: rgba(224,85,106,.3); }
.btn-danger:hover { background: rgba(224,85,106,.1); }

.rate-bar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 10px; padding: 12px 16px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 18px;
  font-size: 12.5px; color: var(--muted);
}
.rate-bar .rate-val { 
  color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; 
  transition: color 0.3s, transform 0.2s; display: inline-block; min-width: 60px; text-align: right;
}
.rate-bar .rate-val.flash { animation: valueFlash 0.6s ease; }
@keyframes valueFlash {
  0% { color: var(--green); transform: scale(1.1); }
  100% { color: var(--accent); transform: scale(1); }
}
.rate-bar .status { display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot.loading { background: var(--accent); animation: pulse 1s infinite; }
.dot.err { background: var(--red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.summary-card {
  padding: 16px; background: linear-gradient(180deg, var(--surface), #11151d);
  border: 1px solid var(--border); border-radius: var(--radius);
  text-align: center;
}
.summary-card .label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.summary-card .value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; word-break: break-all; }
.summary-card.income .value { color: var(--green); }
.summary-card.expense .value { color: var(--red); }
.summary-card.total .value { color: var(--accent); }

.group { margin-bottom: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.group.month-group { margin: 8px 12px; border-radius: 10px; }
.group.day-group { margin: 8px 12px; border-radius: 8px; }
.group-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; cursor: pointer; user-select: none;
  background: var(--surface-2); transition: background .15s;
}
.group-header:hover { background: #222836; }
.gh-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chevron { font-size: 10px; color: var(--muted); transition: transform .2s; }
.group.open > .group-header .chevron { transform: rotate(90deg); }
.group-title { font-size: 14px; font-weight: 600; }
.gh-stats { display: flex; gap: 10px; font-size: 11.5px; font-variant-numeric: tabular-nums; flex-wrap: wrap; justify-content: flex-end; }
.gh-stat.income { color: var(--green); }
.gh-stat.expense { color: var(--red); }
.gh-stat.total { color: var(--accent); font-weight: 700; }

.group-body { display: none; border-top: 1px solid var(--border); }
.group.open > .group-body { display: block; }

.entry {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  border-top: 1px solid var(--border); transition: background .15s;
}
.entry:hover { background: rgba(255,255,255,.02); }
.entry-icon {
  width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2);
  display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none;
  border: 1px solid var(--border);
}
.entry-main { flex: 1; min-width: 0; }
.entry-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry-meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
.entry-price { text-align: right; flex: none; max-width: 200px; }
.entry-price .p-main { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; word-break: break-all; }
.entry-price .p-sub { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 3px; word-break: break-all; }
.entry-actions { display: flex; gap: 6px; flex: none; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent;
  background: transparent; color: var(--muted); cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center; transition: .15s;
}
.icon-btn:hover { background: var(--surface-2); border-color: var(--border); color: var(--text); }
.icon-btn.del-btn:hover { color: var(--red); border-color: rgba(224,85,106,.3); background: rgba(224,85,106,.1); }

.empty { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 14px; }
.empty .big { font-size: 36px; margin-bottom: 10px; opacity: .5; }

.footer-area {
  margin-top: 32px; padding-top: 20px; border-top: 1px dashed var(--border);
}
.rate-info {
  text-align: center; font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 20px;
}
.rate-info strong { color: var(--accent); font-variant-numeric: tabular-nums; }
.cloud-guide {
  background: var(--surface-2); padding: 16px; border-radius: 12px;
  font-size: 12.5px; color: var(--muted); line-height: 1.8; text-align: left;
  border: 1px solid var(--border);
}
.cloud-guide b { color: var(--text); display: block; margin-bottom: 2px; }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.65); backdrop-filter: blur(4px);
  display: none; align-items: flex-end; justify-content: center; z-index: 1000; padding: 0;
}
.modal-overlay.show { display: flex; }
@media(min-width: 640px) { .modal-overlay { align-items: center; padding: 20px; } }
.modal {
  background: var(--surface); width: 100%; max-width: 520px; max-height: 92vh;
  overflow-y: auto; border-radius: 20px 20px 0 0; border: 1px solid var(--border);
  box-shadow: var(--shadow); animation: slideUp .25s ease;
}
@media(min-width: 640px) { .modal { border-radius: var(--radius); } }
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 2; }
.modal-header h2 { font-size: 16px; font-weight: 700; }
.modal-body { padding: 18px 20px; }
.modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; position: sticky; bottom: 0; background: var(--surface); }

.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
.form-group input[type="text"], .form-group input[type="number"], .form-group select, .form-group textarea {
  width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px;
  background: #0d1016; color: var(--text); font-size: 15px; outline: none; transition: .15s;
  font-variant-numeric: tabular-nums; font-family: inherit;
}
.form-group textarea { resize: vertical; min-height: 100px; font-size: 13px; font-family: monospace; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.form-group input[type="number"]::-webkit-outer-spin-button, .form-group input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
.form-group input[type="number"] { -moz-appearance: textfield; }

.date-input-group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.date-input-group input {
  text-align: center;
  padding: 10px 6px;
  font-size: 16px;
  font-weight: 600;
}
.date-input-group input#fYear { flex: 1.5; }
.date-input-group input#fMonth { flex: 1; }
.date-input-group input#fDay { flex: 1; }
.date-input-group span {
  font-size: 14px;
  color: var(--muted);
  user-select: none;
}

/* ================================================================
   全屏历史页面（防拦截降级方案）
   ================================================================ */
.history-overlay {
  position: fixed; inset: 0; background: var(--bg); z-index: 3000;
  display: none; flex-direction: column; align-items: center;
  overflow-y: auto; padding: 40px 20px;
}
.history-overlay.show { display: flex; }
.history-container {
  max-width: 760px; width: 100%;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 40px; box-shadow: var(--shadow);
}
.history-rate {
  text-align: center; font-size: 18px; font-weight: 600;
  color: var(--accent); margin-bottom: 30px; padding-bottom: 15px;
  border-bottom: 1px dashed var(--border); font-variant-numeric: tabular-nums;
}
.history-title { font-size: 24px; margin-bottom: 24px; text-align: center; }
.history-content { font-size: 15px; line-height: 1.9; color: var(--muted); }
.history-content p { margin-bottom: 16px; }
.history-content b { color: var(--text); }
.history-close-btn {
  position: fixed; top: 20px; right: 20px; width: 44px; height: 44px;
  border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text); font-size: 20px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 3010; transition: .2s;
}
.history-close-btn:hover { background: var(--red); border-color: var(--red); }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
  padding: 10px 20px; border-radius: 30px; font-size: 13px; box-shadow: var(--shadow);
  opacity: 0; transition: .3s; z-index: 4000; pointer-events: none; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

@media(max-width: 480px) {
  .entry-icon { width: 34px; height: 34px; font-size: 15px; }
  .summary-card .value { font-size: 15px; }
  .gh-stats { font-size: 10.5px; gap: 6px; }
  .entry-price { max-width: 140px; }
  .history-container { padding: 20px; }
}
</style>
</head>
<body>
<div class="wrap" id="app">

  <header>
    <h1 data-i18n="headerTitle">魏玛记账</h1>
    <div class="header-actions">
      <select class="lang-select" id="langSelect">
        <option value="zh-CN">中文（简体）</option>
        <option value="zh-TW">中文（繁體）</option>
        <option value="en-GB">English (UK)</option>
        <option value="ja-JP">日本語（日本）</option>
        <option value="de-DE">Deutsch (Deutschland)</option>
      </select>
      <button class="btn btn-sm" id="historyBtn" data-i18n="historyBtn">关于通胀</button>
      <button class="btn btn-sm" id="syncBtn" data-i18n="dataManager">数据备份</button>
      <button class="btn btn-sm" id="toggleModeBtn" data-i18n="btnToMark">切换纸马克</button>
      <button class="btn btn-primary btn-sm" id="addBtn">＋ <span data-i18n="add">新增</span></button>
    </div>
  </header>

  <div class="rate-bar">
    <div class="status">
      <span class="dot loading" id="rateDot"></span>
      <span id="rateText" data-i18n="rateLoading">获取实时汇率中…</span>
    </div>
    <div>
      <span data-i18n="usdToCny">1 USD =</span>
      <span class="rate-val" id="usdCnyRate">--</span>
      <span data-i18n="cny">CNY</span>
      <span style="font-size:10px;color:var(--muted);margin-left:6px;" id="rateTime"></span>
      <button class="icon-btn" id="refreshRate" title="Refresh" style="display:inline-flex;margin-left:4px;">⟳</button>
    </div>
  </div>

  <div class="summary-grid">
    <div class="summary-card income">
      <div class="label" data-i18n="totalIncome">总收入</div>
      <div class="value" id="sumIncome">0.00</div>
    </div>
    <div class="summary-card expense">
      <div class="label" data-i18n="totalExpense">总支出</div>
      <div class="value" id="sumExpense">0.00</div>
    </div>
    <div class="summary-card total">
      <div class="label" data-i18n="netTotal">总额</div>
      <div class="value" id="sumTotal">0.00</div>
    </div>
  </div>

  <div id="listContainer"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <div class="big">📒</div>
    <div data-i18n="emptyHint">还没有账目，点击右上角“新增”开始记录</div>
  </div>

  <div class="footer-area">
    <div class="rate-info" id="rateInfo"></div>
    <div class="cloud-guide" id="cloudGuide"></div>
  </div>

</div>

<!-- 主编辑弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle" data-i18n="editTitle">编辑条目</h2>
      <button class="icon-btn" id="modalClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label data-i18n="type">类型</label>
        <select id="fType">
          <option value="expense" data-i18n="expense">支出</option>
          <option value="income" data-i18n="income">收入</option>
        </select>
      </div>
      <div class="form-group">
        <label data-i18n="fieldName">名称 / 备注</label>
        <input type="text" id="fName" placeholder="例如：工资、餐饮">
      </div>
      <div class="form-group">
        <label data-i18n="fieldPrice">金额（人民币）</label>
        <input type="number" id="fPrice" step="0.01" min="0" placeholder="0.00">
      </div>
      
      <div class="form-group">
        <label data-i18n="fieldDate">日期</label>
        <div class="date-input-group">
          <input type="number" id="fYear" placeholder="YYYY" min="1900" max="2100">
          <span data-i18n="year">年</span>
          <input type="number" id="fMonth" placeholder="MM" min="1" max="12">
          <span data-i18n="month">月</span>
          <input type="number" id="fDay" placeholder="DD" min="1" max="31">
          <span data-i18n="day">日</span>
        </div>
        <input type="hidden" id="fDate">
      </div>
      
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-danger" id="deleteBtn" style="display:none;" data-i18n="delete">删除</button>
      <button type="button" class="btn" id="modalCancel" style="flex:1;" data-i18n="cancel">取消</button>
      <button type="button" class="btn btn-primary" id="saveBtn" style="flex:2;" data-i18n="save">保存</button>
    </div>
  </div>
</div>

<!-- 数据备份弹窗 -->
<div class="modal-overlay" id="syncModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 data-i18n="dataManager">数据备份与恢复</h2>
      <button class="icon-btn" id="syncModalClose">✕</button>
    </div>
    <div class="modal-body">
      <div style="display:flex; gap:10px; margin-bottom:16px;">
        <button class="btn btn-primary" id="exportFileBtn" style="flex:1;" data-i18n="exportFile">导出文件</button>
        <button class="btn" id="importFileBtn" style="flex:1;" data-i18n="importFile">导入文件</button>
        <input type="file" id="importFileInput" accept=".json" style="display:none;">
      </div>
      
      <div class="form-group">
        <label data-i18n="textData">复制/粘贴数据文本</label>
        <textarea id="dataTextArea" placeholder="在下方粘贴备份文本并点击加载，或点击上方导出..."></textarea>
      </div>
      
      <div style="display:flex; gap:10px;">
        <button class="btn" id="copyDataBtn" style="flex:1;" data-i18n="copyData">复制文本</button>
        <button class="btn btn-primary" id="pasteDataBtn" style="flex:1;" data-i18n="loadFromText">从文本加载</button>
      </div>
    </div>
  </div>
</div>

<!-- 历史信息全屏页面（降级备用） -->
<div class="history-overlay" id="historyOverlay">
  <button class="history-close-btn" id="historyClose">✕</button>
  <div class="history-container">
    <div class="history-rate" id="historyRateDisplay"></div>
    <h1 class="history-title" id="historyTitle"></h1>
    <div class="history-content" id="historyContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================================================================
   常量
   ================================================================ */
const MARK_PER_USD = 4.2e12;
const FALLBACK_USD_CNY = 7.25;
const RATE_URL_PRIMARY = 'https://api.frankfurter.dev/v2/rates?base=USD';
const RATE_URL_BACKUP = 'https://allratestoday.com/api/open/latest/USD';
const STORAGE_KEY = 'weimar_ledger_entries_v5';
const LANG_KEY = 'weimar_ledger_lang';
const RATE_CACHE_KEY = 'weimar_ledger_rate';

/* ================================================================
   i18n 字典
   ================================================================ */
const I18N = {
  'zh-CN': {
    headerTitle:'魏玛记账', add:'新增', rateLoading:'获取实时汇率中…', rateOk:'实时汇率已更新', rateErr:'汇率获取失败，使用离线回退', usdToCny:'1 USD =', cny:'CNY',
    totalIncome:'总收入', totalExpense:'总支出', netTotal:'总额',
    btnToMark:'切换纸马克', btnToCny:'切换人民币',
    dataManager:'数据备份', exportFile:'导出文件', importFile:'导入文件', textData:'复制/粘贴数据文本', copyData:'复制文本', loadFromText:'从文本加载',
    historyBtn:'关于通胀',
    guideTitle:'本地数据管理指南：',
    guideContent:`<b>1. 导出 / 导入文件：</b><br>点击“导出文件”下载备份（如在微信内请用浏览器打开），在其他设备点击“导入文件”恢复。<br><br>
                  <b>2. 文本复制：</b><br>点击“复制文本”发给自己，在另一台设备粘贴后点击“从文本加载”。<br><br>
                  <b>3. 多标签页：</b><br>同一浏览器开多个页面，修改数据会自动同步！`,
    historyTitle:'1923年德国恶性通货膨胀',
    historyContent:`<p>1923年，德国魏玛共和国经历了历史上最严重的恶性通货膨胀之一。第一次世界大战战败后，德国被迫签订了《凡尔赛条约》，承担了巨额的战争赔款。为了支付赔款和维持国内运转，德国政府选择了最简单粗暴的方法：疯狂印钞。</p>

/* ================================================================
   工具函数与日期联动逻辑
   ================================================================ */
function isLeapYear(y) {
  return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
}
function getDaysInMonth(y, m) {
  if (!y || !m) return 31;
  const monthDays = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  if (m === 2 && isLeapYear(y)) return 29;
  return monthDays[m - 1] || 31;
}
function validateDateInput() {
  let y = parseInt(fYear.value);
  let m = parseInt(fMonth.value);
  let d = parseInt(fDay.value);
  if (isNaN(y)) y = new Date().getFullYear();
  if (isNaN(m)) m = new Date().getMonth() + 1;
  if (isNaN(d)) d = 1;
  if (m < 1) { m = 1; fMonth.value = 1; }
  if (m > 12) { m = 12; fMonth.value = 12; }
  const maxDays = getDaysInMonth(y, m);
  if (d < 1) { d = 1; fDay.value = 1; }
  if (d > maxDays) { d = maxDays; fDay.value = maxDays; }
  if (fDay.value === '') fDay.value = 1;
  fDay.setAttribute('max', maxDays);
}
fYear.addEventListener('input', validateDateInput);
fMonth.addEventListener('input', validateDateInput);
fDay.addEventListener('input', validateDateInput);

function parseDate(str) {
  if (!str) return null;
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}
function todayStr() { return fmtDate(new Date()); }

function formatVal(v, isMark) {
  if (!isFinite(v)) return '—';
  const num = isMark ? (v / usdCnyRate * MARK_PER_USD) : v;
  const formatted = Math.abs(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const sign = num < 0 ? '-' : '';
  const symbol = isMark ? 'ℳ ' : '￥ ';
  return `${symbol}${sign}${formatted}`;
}
function formatNum(v) {
  if (!isFinite(v)) return '—';
  return Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtMain(v) {
  return formatVal(v, isPapiermarkMode);
}
function displayDate(str, lang) {
  const d = parseDate(str);
  if (!d) return '';
  if (lang === 'zh-CN' || lang === 'zh-TW' || lang === 'ja-JP') {
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  }
  return d.toLocaleDateString(lang === 'de-DE' ? 'de-DE' : 'en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

        <div class="container">
          <div class="rate-display" id="rateDisplay">1 CNY ≈ ...</div>
          <h1>${title}</h1>
          <div class="content">${content}</div>
        </div>
        <script>
          window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'update') {
              document.getElementById('rateDisplay').innerHTML = e.data.rateHtml;
              document.querySelector('h1').textContent = e.data.title;
              document.querySelector('.content').innerHTML = e.data.content;

    historyWin.document.close();
    setTimeout(sendHistoryData, 500);

}

function showHistoryOverlay() {
  const cnyToPm = MARK_PER_USD / usdCnyRate;
  const rateStr = cnyToPm.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  $('historyRateDisplay').innerHTML = t('bottomRate').replace('{rate}', rateStr);
  $('historyTitle').textContent = t('historyTitle');
  $('historyContent').innerHTML = t('historyContent');
  historyOverlay.classList.add('show');
}

function sendHistoryData() {
  if (!historyWin || historyWin.closed) return;
  const cnyToPm = MARK_PER_USD / usdCnyRate;
  const rateStr = cnyToPm.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const rateHtml = t('bottomRate').replace('{rate}', rateStr);
  
  historyWin.postMessage({
    type: 'update',
    rateHtml: rateHtml,
    title: t('historyTitle'),
    content: t('historyContent')
  }, '*');
}

function t(key) {
  return (I18N[currentLang] && I18N[currentLang][key]) || I18N['zh-CN'][key] || key;
}
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    el.textContent = t(key);
  });
  
  const cloudGuideEl = $('cloudGuide');
  if (cloudGuideEl) {
    cloudGuideEl.innerHTML = `<b>${t('guideTitle')}</b><br>${t('guideContent')}`;
  }
  
  const h1 = document.querySelector('header h1');
  if (h1) h1.textContent = t('headerTitle');
  document.documentElement.lang = currentLang;
  
  if (historyWin && !historyWin.closed) {
    sendHistoryData();
  }
  if (historyOverlay.classList.contains('show')) {
    showHistoryOverlay();
  }
}

/* ================================================================
   汇率获取与渲染
   ================================================================ */
async function fetchRealRate() {
  let newRate = null;
  try {
    const res = await fetch(RATE_URL_PRIMARY + '&t=' + Date.now(), { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      if (data.rates && data.rates.CNY) newRate = parseFloat(data.rates.CNY);
    }
  } catch (e) {}
  if (!newRate) {
    try {
      const res = await fetch(RATE_URL_BACKUP + '?t=' + Date.now(), { cache: 'no-store' });
      if (res.ok) {
        const data = await res.json();
        if (data.rates && data.rates.CNY) newRate = parseFloat(data.rates.CNY);
      }
    } catch (e) {}
  }
  if (newRate && newRate > 0) {
    realRate = newRate;
    persistRate(realRate);
    $('rateDot').className = 'dot ok';
    $('rateText').textContent = t('rateOk');
  } else {
    const cached = loadRateCache();
    if (cached) realRate = cached.rate;
    else realRate = FALLBACK_USD_CNY;
    $('rateDot').className = 'dot err';
    $('rateText').textContent = t('rateErr');
  }
}
function persistRate(rate) {
  try { localStorage.setItem(RATE_CACHE_KEY, JSON.stringify({ rate, date: todayStr() })); } catch (e) {}
}
function loadRateCache() {
  try {
    const raw = localStorage.getItem(RATE_CACHE_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (obj.rate && obj.date) return obj;
  } catch (e) {}
  return null;
}
function startRateTicker() {
  setInterval(() => {
    const jitter = (Math.random() - 0.5) * 0.0006;
    usdCnyRate = realRate + jitter;
    usdRateDisplay.textContent = usdCnyRate.toFixed(4);
    rateTimeEl.textContent = new Date().toLocaleTimeString();
    usdRateDisplay.classList.remove('flash');
    void usdRateDisplay.offsetWidth;
    usdRateDisplay.classList.add('flash');
    
    updateAmounts();
    
    if (historyWin && !historyWin.closed) sendHistoryData();
    if (historyOverlay.classList.contains('show')) {
      const cnyToPm = MARK_PER_USD / usdCnyRate;
      const rateStr = cnyToPm.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      $('historyRateDisplay').innerHTML = t('bottomRate').replace('{rate}', rateStr);
    }
  }, 1000);
}
function updateAmounts() {
  const { inc, exp, tot } = calculateTotals();
  $('sumIncome').textContent = fmtMain(inc);
  $('sumExpense').textContent = fmtMain(exp);
  $('sumTotal').textContent = fmtMain(tot);

  const cnyToPm = MARK_PER_USD / usdCnyRate;
  const rateStr = cnyToPm.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  $('rateInfo').innerHTML = t('bottomRate').replace('{rate}', rateStr);

  document.querySelectorAll('.entry-price .p-pm').forEach(el => {
    const cny = parseFloat(el.dataset.cny);
    if (isNaN(cny)) return;
    const pm = cny / usdCnyRate * MARK_PER_USD;
    el.textContent = `ℳ ${pm < 0 ? '-' : ''}${formatNum(pm)}`;
  });

  document.querySelectorAll('.gh-stat').forEach(el => {
    const val = parseFloat(el.dataset.val);
    if (isNaN(val)) return;
    const label = el.dataset.label;
    el.textContent = `${label}: ${fmtMain(val)}`;
  });
}

/* ================================================================
   数据与列表渲染
   ================================================================ */
function loadEntries() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(entries)) entries = [];
    entries.forEach(e => {
      if (!e.type) e.type = 'expense';
      if (!e.id) e.id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random();
    });
  } catch (e) { entries = []; }
}
function saveEntries() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch (e) {}
}
function exportData() {
  if (!entries || entries.length === 0) { toastMsg('当前没有数据可以导出'); return; }
  try {
    const dataStr = JSON.stringify(entries, null, 2);
    const blob = new Blob([dataStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `weimar_ledger_${todayStr()}.json`;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
    toastMsg(t('syncSuccess'));
  } catch (err) {
    try {
      const dataStr = encodeURIComponent(JSON.stringify(entries, null, 2));
      const a = document.createElement('a');
      a.href = 'data:application/json;charset=utf-8,' + dataStr;
      a.download = `weimar_ledger_${todayStr()}.json`;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      toastMsg(t('syncSuccess'));
    } catch (e2) { toastMsg('导出失败，请使用下方的“复制文本”'); }
  }
}
function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      if (Array.isArray(imported)) {
        entries = imported;
        entries.forEach(e => { if (!e.id) e.id = Date.now() + '-' + Math.random(); });
        saveEntries();
        render();
        closeSyncModal();
        toastMsg(t('syncLoadOk'));
      } else throw new Error();
    } catch (err) { toastMsg(t('syncErr')); }
  };
  reader.readAsText(file);
  event.target.value = '';
}
function copyText() {
  if (!entries || entries.length === 0) { toastMsg('当前没有数据'); return; }
  const text = JSON.stringify(entries);
  navigator.clipboard.writeText(text).then(() => {
    toastMsg(t('copyData'));
  }).catch(() => {
    dataTextArea.value = text;
    dataTextArea.select();
    document.execCommand('copy');
    toastMsg(t('copyData'));
  });
}
function loadFromText() {
  try {
    const text = dataTextArea.value.trim();
    if (!text) return;
    const imported = JSON.parse(text);
    if (Array.isArray(imported)) {
      entries = imported;
      entries.forEach(e => { if (!e.id) e.id = Date.now() + '-' + Math.random(); });
      saveEntries();
      render();
      closeSyncModal();
      toastMsg(t('syncLoadOk'));
    } else throw new Error();
  } catch (e) { toastMsg(t('syncErr')); }
}

window.addEventListener('storage', (e) => {
  if (e.key === STORAGE_KEY) {
    loadEntries();
    render();
  }
});

function calculateTotals() {
  let inc = 0, exp = 0;
  entries.forEach(e => {
    if (e.type === 'income') inc += e.price;
    else exp -= e.price;
  });
  return { inc, exp, tot: inc + exp };
}

function render() {
  applyI18n();
  $('toggleModeBtn').textContent = isPapiermarkMode ? t('btnToCny') : t('btnToMark');

  if (!entries.length) {
    listContainer.innerHTML = '';
    emptyState.style.display = 'block';
    updateAmounts();
    return;
  }
  emptyState.style.display = 'none';

  const years = {};
  entries.forEach(e => {
    const d = parseDate(e.date);
    if (!d) return;
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    const dd = d.getDate();
    if (!years[y]) years[y] = {};
    if (!years[y][m]) years[y][m] = {};
    if (!years[y][m][dd]) years[y][m][dd] = [];
    years[y][m][dd].push(e);
  });

  const sortedYears = Object.keys(years).sort((a, b) => b - a);
  let html = '';

  sortedYears.forEach(y => {
    let yInc = 0, yExp = 0;
    Object.values(years[y]).flatMap(m => Object.values(m).flat()).flat().forEach(e => {
      if (e.type === 'income') yInc += e.price; else yExp -= e.price;
    });
    const yTot = yInc + yExp;
    html += `<div class="group year-group open">
      <div class="group-header" onclick="toggleGroup(this)">
        <div class="gh-left"><span class="chevron">▶</span><span class="group-title">${y}${t('year')}</span></div>
        <div class="gh-stats">
          <span class="gh-stat income" data-val="${yInc}" data-label="${t('yearIncome')}">${t('yearIncome')}: ${fmtMain(yInc)}</span>
          <span class="gh-stat expense" data-val="${yExp}" data-label="${t('yearExpense')}">${t('yearExpense')}: ${fmtMain(yExp)}</span>
          <span class="gh-stat total" data-val="${yTot}" data-label="${t('yearTotal')}">${t('yearTotal')}: ${fmtMain(yTot)}</span>
        </div>
      </div><div class="group-body">`;

    const sortedMonths = Object.keys(years[y]).sort((a, b) => b - a);
    sortedMonths.forEach(m => {
      let mInc = 0, mExp = 0;
      Object.values(years[y][m]).flat().forEach(e => {
        if (e.type === 'income') mInc += e.price; else mExp -= e.price;
      });
      const mTot = mInc + mExp;
      html += `<div class="group month-group open">
        <div class="group-header" onclick="toggleGroup(this)">
          <div class="gh-left"><span class="chevron">▶</span><span class="group-title">${m}${t('month')}</span></div>
          <div class="gh-stats">
            <span class="gh-stat income" data-val="${mInc}" data-label="${t('monthIncome')}">${t('monthIncome')}: ${fmtMain(mInc)}</span>
            <span class="gh-stat expense" data-val="${mExp}" data-label="${t('monthExpense')}">${t('monthExpense')}: ${fmtMain(mExp)}</span>
            <span class="gh-stat total" data-val="${mTot}" data-label="${t('monthTotal')}">${t('monthTotal')}: ${fmtMain(mTot)}</span>
          </div>
        </div><div class="group-body">`;

      const sortedDays = Object.keys(years[y][m]).sort((a, b) => b - a);
      sortedDays.forEach(dd => {
        const dayEntries = years[y][m][dd];
        let dInc = 0, dExp = 0;
        dayEntries.forEach(e => {
          if (e.type === 'income') dInc += e.price; else dExp -= e.price;
        });
        const dTot = dInc + dExp;
        html += `<div class="group day-group open">
          <div class="group-header" onclick="toggleGroup(this)">
            <div class="gh-left"><span class="chevron">▶</span><span class="group-title">${dd}${t('day')}</span></div>
            <div class="gh-stats">
              <span class="gh-stat income" data-val="${dInc}" data-label="${t('dayIncome')}">${t('dayIncome')}: ${fmtMain(dInc)}</span>
              <span class="gh-stat expense" data-val="${dExp}" data-label="${t('dayExpense')}">${t('dayExpense')}: ${fmtMain(dExp)}</span>
              <span class="gh-stat total" data-val="${dTot}" data-label="${t('dayTotal')}">${t('dayTotal')}: ${fmtMain(dTot)}</span>
            </div>
          </div><div class="group-body">`;
        dayEntries.forEach(e => { html += entryHTML(e); });
        html += `</div></div>`;
      });
      html += `</div></div>`;
    });
    html += `</div></div>`;
  });
  listContainer.innerHTML = html;
  updateAmounts();
}

window.toggleGroup = function(headerEl) {
  const group = headerEl.parentElement;
  if (group) group.classList.toggle('open');
};

function entryHTML(e) {
  const isInc = e.type === 'income';
  const priceColor = isInc ? 'var(--green)' : 'var(--red)';
  const valCNY = isInc ? e.price : -e.price;
  const valPM = isInc ? (e.price / usdCnyRate * MARK_PER_USD) : -(e.price / usdCnyRate * MARK_PER_USD);
  const strCNY = `￥ ${valCNY < 0 ? '-' : ''}${formatNum(valCNY)}`;
  const strPM = `ℳ ${valPM < 0 ? '-' : ''}${formatNum(valPM)}`;
  const dataCny = `${valPM < 0 ? -e.price : e.price}`;

  let innerHTML = '';
  if (isPapiermarkMode) {
    innerHTML = `<div class="p-pm p-main" style="color:${priceColor};" data-cny="${dataCny}">${strPM}</div><div class="p-cny p-sub">${strCNY}</div>`;
  } else {
    innerHTML = `<div class="p-cny p-main" style="color:${priceColor};">${strCNY}</div><div class="p-pm p-sub" data-cny="${dataCny}">${strPM}</div>`;
  }

  return `
  <div class="entry">
    <div class="entry-icon">${isInc ? '💰' : '📦'}</div>
    <div class="entry-main">
      <div class="entry-name">${esc(e.name)}</div>
      <div class="entry-meta"><span>${displayDate(e.date, currentLang)}</span></div>
    </div>
    <div class="entry-price">${innerHTML}</div>
    <div class="entry-actions">
      <button type="button" class="icon-btn" data-edit="${e.id}" title="Edit">✎</button>
      <button type="button" class="icon-btn del-btn" data-del="${e.id}" title="Delete">🗑</button>
    </div>
  </div>`;
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ================================================================
   弹窗与保存逻辑
   ================================================================ */
function openNew() {
  editingId = null;
  modalTitle.textContent = t('newTitle');
  deleteBtn.style.display = 'none';
  fType.value = 'expense';
  fName.value = '';
  fPrice.value = '';
  const today = new Date();
  fYear.value = today.getFullYear();
  fMonth.value = today.getMonth() + 1;
  fDay.value = today.getDate();
  validateDateInput();
  modalOverlay.classList.add('show');
  setTimeout(() => fName.focus(), 200);
}
function openEdit(id) {
  const e = entries.find(x => String(x.id) === String(id));
  if (!e) return;
  editingId = e.id;
  modalTitle.textContent = t('editTitle');
  deleteBtn.style.display = 'inline-flex';
  fType.value = e.type || 'expense';
  fName.value = e.name;
  fPrice.value = e.price;
  const d = parseDate(e.date);
  if (d) {
    fYear.value = d.getFullYear();
    fMonth.value = d.getMonth() + 1;
    fDay.value = d.getDate();
  } else {
    fYear.value = '';
    fMonth.value = '';
    fDay.value = '';
  }
  validateDateInput();
  modalOverlay.classList.add('show');
}
function closeModal() { modalOverlay.classList.remove('show'); }
function openSyncModal() { dataTextArea.value = ''; syncModalOverlay.classList.add('show'); }
function closeSyncModal() { syncModalOverlay.classList.remove('show'); }

function saveEntry() {
  const name = fName.value.trim();
  const price = parseFloat(fPrice.value);
  const type = fType.value;
  let y = parseInt(fYear.value);
  let m = parseInt(fMonth.value);
  let d = parseInt(fDay.value);

  if (!name) { toastMsg('请输入名称'); return; }
  if (!isFinite(price) || price < 0) { toastMsg('请输入有效金额'); return; }
  if (isNaN(y) || isNaN(m) || isNaN(d)) { toastMsg('请填写完整日期'); return; }

  const maxDays = getDaysInMonth(y, m);
  if (d > maxDays) d = maxDays;
  const pad = n => n.toString().padStart(2, '0');
  const date = `${y}-${pad(m)}-${pad(d)}`;
  const data = { name, price, date, type };

  if (editingId) {
    const idx = entries.findIndex(e => String(e.id) === String(editingId));
    if (idx >= 0) entries[idx] = { ...entries[idx], ...data };
  } else {
    const newId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random();
    entries.push({ id: newId, ...data });
  }
  saveEntries();
  closeModal();
  render();
  toastMsg(t('toastSaved'));
}
function deleteEntry(id) {
  const idx = entries.findIndex(e => String(e.id) === String(id));
  if (idx > -1) {
    entries.splice(idx, 1);
    saveEntries();
    closeModal();
    render();
    toastMsg(t('toastDeleted'));
  }
}

let toastTimer;
function toastMsg(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

/* ================================================================
   事件绑定
   ================================================================ */
listContainer.addEventListener('click', (ev) => {
  const editBtn = ev.target.closest('[data-edit]');
  if (editBtn) {
    ev.preventDefault(); ev.stopPropagation(); openEdit(editBtn.dataset.edit); return;
  }
  const delBtn = ev.target.closest('[data-del]');
  if (delBtn) {
    ev.preventDefault(); ev.stopPropagation(); deleteEntry(delBtn.dataset.del); return;
  }
});

$('addBtn').addEventListener('click', openNew);
$('modalClose').addEventListener('click', closeModal);
$('modalCancel').addEventListener('click', closeModal);
$('saveBtn').addEventListener('click', saveEntry);
deleteBtn.addEventListener('click', () => { if (editingId) deleteEntry(editingId); });
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
$('refreshRate').addEventListener('click', async () => { await fetchRealRate(); updateAmounts(); });

// 历史页面按钮与关闭
$('historyBtn').addEventListener('click', openHistoryPage);
$('historyClose').addEventListener('click', () => { historyOverlay.classList.remove('show'); });

// 数据备份
$('syncBtn').addEventListener('click', openSyncModal);
$('syncModalClose').addEventListener('click', closeSyncModal);
$('syncModalOverlay').addEventListener('click', (e) => { if (e.target === syncModalOverlay) closeSyncModal(); });
$('exportFileBtn').addEventListener('click', exportData);
$('importFileBtn').addEventListener('click', () => $('importFileInput').click());
$('importFileInput').addEventListener('change', handleImportFile);
$('copyDataBtn').addEventListener('click', copyText);
$('pasteDataBtn').addEventListener('click', loadFromText);

$('toggleModeBtn').addEventListener('click', () => { isPapiermarkMode = !isPapiermarkMode; render(); });
$('langSelect').addEventListener('change', (e) => {
  currentLang = e.target.value;
  try { localStorage.setItem(LANG_KEY, currentLang); } catch (err) {}
  render();
});
[fName, fPrice].forEach(el => { el.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveEntry(); }); });

/* ================================================================
   初始化
   ================================================================ */
async function init() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && I18N[saved]) currentLang = saved;
  } catch (e) {}
  $('langSelect').value = currentLang;
  loadEntries();
  const cached = loadRateCache();
  if (cached) realRate = cached.rate;
  applyI18n();
  render();
  await fetchRealRate();
  updateAmounts();
  startRateTicker();
  setInterval(fetchRealRate, 5 * 60 * 1000);
}
init();
</script>
